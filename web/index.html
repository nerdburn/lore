<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Lore Board</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238a4b1f'/%3E%3Crect x='7' y='8' width='5' height='16' rx='1.5' fill='%23fbfaf7'/%3E%3Crect x='14' y='8' width='5' height='11' rx='1.5' fill='%23fbfaf7'/%3E%3Crect x='21' y='8' width='5' height='7' rx='1.5' fill='%23fbfaf7'/%3E%3C/svg%3E" />
    <script>
      // Pick the theme before first paint so there is no flash.
      ;(function () {
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var el = document.documentElement
        el.classList.add(dark ? 'dark' : 'light')
        el.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
