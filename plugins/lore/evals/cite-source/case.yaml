schema_version: "1.0"
name: cite-source
description: A who/when question is answered from the raw stream with a checkable citation.
tags: [grep, citation]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    When was the November 17 launch date for the landing page decided, and who made the call? Cite your source.
  max_turns: 14
  allowed_tools: [Skill, mcp__plugin_lore_lore__lore_recall, mcp__plugin_lore_lore__lore_grep, mcp__plugin_lore_lore__lore_read]
graders:
  - name: facts
    type: regex
    weight: 1
    pattern: '(2026-08-03|Aug(ust)? 3,? 2026)[\s\S]*Shawn|Shawn[\s\S]*(2026-08-03|Aug(ust)? 3,? 2026)'
  - name: citation
    type: llm
    weight: 1
    criteria: |
      The answer says Shawn Adrian decided it on 2026-08-03 (August 3, 2026), in
      reply to Priya's request, and cites a checkable source: the Slack permalink
      https://slack.com/archives/C0ACME/p1754230200000200 or the stream path
      context/streams/slack/#acme/2026-08-03.md.
