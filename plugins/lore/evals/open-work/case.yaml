schema_version: "1.0"
name: open-work
description: Status questions are answered from the lore tracker (the tracker of record), with the GitHub snapshot as evidence and freshness stated.
tags: [status, work-table]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    What work is open right now for this project, and when was this memory last synced?
  max_turns: 14
  allowed_tools: [Skill, mcp__plugin_lore_lore__lore_recall, mcp__plugin_lore_lore__lore_grep, mcp__plugin_lore_lore__lore_read]
graders:
  - name: uses-recall
    type: tool_used
    weight: 1
    tool: mcp__plugin_lore_lore__lore_recall
  - name: answers-from-work-table
    type: llm
    weight: 1
    criteria: |
      PASS if the response (a) says exactly one ticket is open in the tracker —
      ACM-1, the Black Friday landing page, in progress — attributing that to lore's
      work tracker (not to a guess from Slack), ideally noting it moved to in progress
      because PR #42 was opened, and (b) gives the time or date the memory was last
      synced (2026-08-21). Mentioning the open PR #42 from GitHub's table as evidence,
      or requests/roadmap presented as distinct from tracker state, is acceptable.
      FAIL if it invents other open tickets, presents the closed ACM-2 as open, says
      it cannot reach the data, omits the last-synced time, or claims to have
      pinned/saved/moved anything.
